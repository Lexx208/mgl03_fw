name: Build Voyah ADB Console APK
on:
  push:
    branches: [voyah-adb-console-build]
    paths: ['voyah-adb-console/**', '.github/workflows/voyah-adb-console.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voyah-adb-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VoyahAdbConsole-v1.4.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoyahAdbConsole-v1.4-apk
          path: voyah-adb-console/VoyahAdbConsole-v1.4.apk
          if-no-files-found: error
